name: "🐛 Bug report"
description: Something in the repo does not work as documented.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste API keys, Kaggle tokens or other secrets.
        For a security problem, follow SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make setup
        2. make test
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or traceback
      render: text
  - type: input
    id: commit
    attributes:
      label: Commit or day
      description: The commit hash or the Day N you were on.
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: macOS 15, Python 3.13, uv 0.5
